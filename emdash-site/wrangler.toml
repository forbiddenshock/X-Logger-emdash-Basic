name = "emdash-xlog"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[vars]
SITE_TITLE = "X-Log"
SITE_SUBTITLE = "Daily X (Twitter) Archive powered by EmDash (Cloudflare D1 + R2)"
TIMEZONE = "Asia/Tokyo"
POSTS_PER_PAGE = "7"

